<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeNotes</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Roboto', 'Arial', sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #0f0f0f;
    }
    p {
      font-size: 13px;
      color: #606060;
      line-height: 1.5;
      margin: 0;
    }
    p:nth-of-type(2) {
      max-width: 260px;
      word-break: normal;
    }
    p:first-of-type {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>TubeNotes</h1>
  <p>Open a YouTube video to pin screenshots/videos, add text/audio notes, and export key takeaways.</p>
  <p style="margin-top: 12px;"><strong>Note:</strong> Please refresh your YouTube video page to start using :)</p>
</body>
</html>
